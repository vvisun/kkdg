syntax = "proto3";
package pbbase;
option go_package = ".;pbbase";


message Int32 {
    int32 value = 1;
}

message Uint32 {
    uint32 value = 1;
}

message Int64 {
    int64 value = 1;
}

message UInt64 {
    uint64 value = 1;
}

message Bool {
    bool value = 1;
}

message String {
    string value = 1;
}

message Bytes {
    bytes value = 1;
}

message BytesList {
    repeated Bytes valueList = 1;
}

message Int64List {
    repeated int64 valueList = 1;
}

message UInt64List {
    repeated uint64 valueList = 1;
}

message Int32List {
    repeated int32 valueList = 1;
}

message Uint32List {
    repeated uint32 valueList = 1;
}

message StringList {
    repeated string valueList = 1;
}
