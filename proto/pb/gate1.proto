syntax = "proto3";
package pb;
option go_package = ".;pb";

// 心跳请求
message HeartbeatReq {
    int64 timestamp = 1; // 客户端时间戳（ms）
}

// 玩家移动请求
message PlayerMoveReq {
    float x = 1; // X坐标
    float y = 2; // Y坐标
    float z = 3; // Z坐标
    int32 dir = 4; // 方向
}

// 聊天请求
message ChatReq {
    string content = 1; // 聊天内容
    uint32 channel = 2; // 频道（1-世界，2-公会）
}
