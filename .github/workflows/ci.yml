name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -short -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Coverage gate
        run: |
          COVER=$(go tool cover -func=coverage.out | grep '^total:' | awk '{gsub(/%/,""); print $NF}')
          if [ -z "$COVER" ]; then echo "No coverage data"; exit 1; fi
          THRESHOLD=35
          if [ "$(printf '%s\n' "$THRESHOLD" "$COVER" | sort -n | head -1)" != "$THRESHOLD" ]; then
            echo "Coverage ${COVER}% is below ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVER}% meets threshold ${THRESHOLD}%"
