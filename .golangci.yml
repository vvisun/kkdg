# golangci-lint 配置
# 文档: https://golangci-lint.run/usage/configuration/
run:
  timeout: 5m
  modules-download-mode: readonly
  build-tags: []

# 排除生成代码与示例
issues:
  exclude-rules:
    - path: _gen\.go$
      linters: [all]
    - path: \.pb\.go$
      linters: [all]
    - path: proto/
      linters: [all]
    - path: other/
      linters: [all]
  exclude-use-default: false

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
  disable:
    - deadcode
    - varcheck
    - structcheck

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/vvisun/kkdg
